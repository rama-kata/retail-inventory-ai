[project]
name = "retail-inventory-ai"
version = "0.1.0"
description = "Retail inventory KPIs, XGBoost demand forecasting, and RAG Q&A"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "xgboost>=1.7.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=2.2.0", "faiss-cpu>=1.7.0", "requests>=2.28.0"]
app = ["dash>=2.14.0", "dash-bootstrap-components>=1.5.0", "plotly>=5.18.0"]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
